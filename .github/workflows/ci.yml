name: CI

on:
  push:
    branches: [main, Dev]
  pull_request:

jobs:
  qualidade:
    name: Lint e testes (API)
    runs-on: ubuntu-latest

    env:
      # Credenciais falsas: o esqueleto ainda nao fala com o Supabase, mas o
      # Settings exige as variaveis. Segredos reais entram como GitHub Secrets
      # quando a integracao existir.
      SUPABASE_URL: https://ci.supabase.co
      SUPABASE_KEY: chave-de-ci
      APP_ENV: staging

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Formatacao (black)
        run: black --check .

      - name: Lint (ruff)
        run: ruff check .

      # -rxX lista no log do CI as lacunas conhecidas (xfail) de todo build, para elas
      # ficarem visiveis e nao esquecidas (ex.: guardrails, issue #7).
      - name: Testes (pytest)
        run: pytest -q -rxX

  imagem:
    name: Build da imagem Docker
    runs-on: ubuntu-latest
    needs: qualidade

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t claudinho-api:${{ github.sha }} .

# TODO: o quality gate de RAGAS (faithfulness >= 0.90, recall >= 0.95) descrito em
# Docs/Production/01, secao 3.2, entra como um job aqui depois que o benchmark de
# 50 perguntas existir.

  front:
    name: Lint e testes (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Formatacao (prettier)
        run: npm run format:check

      - name: Testes (vitest)
        run: npm test

      - name: Build
        run: npm run build
