[project]
name = "claudinho-api"
version = "0.1.0"
description = "API de checagem de desinformacao nutricional - Challenge 1"
requires-python = ">=3.12,<3.13"
# A Vercel instala por este arquivo (e nao pelo requirements.txt) quando os dois existem:
# sem esta lista, o build instalaria nada e a API quebraria no primeiro import.
# Espelha o requirements.txt; tests/test_dependencias.py garante que nao divergem.
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
    "supabase==2.31.0",
    "limits==5.7.0",
    "httpx==0.28.1",
    "PyJWT==2.13.0",
    "cryptography==50.0.1",
]

[project.optional-dependencies]
# Modelo local e treino (espelha o requirements-ml.txt).
ml = [
    "sentence-transformers==6.0.1",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# Aviso de terceiros: starlette 0.41 usa um alias do anyio que ficou obsoleto.
# Silenciado para que qualquer warning restante na suite seja nosso.
filterwarnings = [
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends/Header/Query em argumentos default sao o padrao do FastAPI, nao um bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
]
